<style>
:root{--red:#a4161a;--red2:#7d1013;--gold:#c8962b;--ink:#1f1d1a;--mut:#6d675e;--line:#ddd6c8;--bg:#faf7f1;--card:#fff;--head:#f3ecdd;--calc:#f6f4ef;--ok:#1b7a43;--warn:#a85d00;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#efe9de;--mut:#a69f92;--line:#3b3731;--bg:#1b1917;--card:#242220;--head:#2e2a24;--calc:#2a2723;--red2:#f08a8d;--ok:#5fd18b;--warn:#f0b35c;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#efe9de;--mut:#a69f92;--line:#3b3731;--bg:#1b1917;--card:#242220;--head:#2e2a24;--calc:#2a2723;--red2:#f08a8d;--ok:#5fd18b;--warn:#f0b35c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
header.top{background:var(--red);color:#fff;padding:14px 20px;border-bottom:4px solid var(--gold)}
header.top .in,nav .in,main{max-width:1200px;margin:0 auto}
header.top .in{display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:space-between;align-items:baseline}
header h1{margin:0;font-size:19px}header small{opacity:.88}
nav{background:var(--card);border-bottom:1px solid var(--line)}nav .in{display:flex;gap:4px;padding:0 12px}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--red2);border-bottom-color:var(--red)}
main{padding:16px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--red2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
.banner{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--card);padding:10px 14px;border-radius:6px;margin:0 0 14px;color:var(--mut);font-size:14px}
.banner.warn{border-left-color:var(--warn);color:var(--warn)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bar .s{display:flex;flex-direction:column;line-height:1.2}.bar .s b{font-size:22px;font-variant-numeric:tabular-nums}.bar .s span{font-size:12px;color:var(--mut)}
.bar .t b{color:var(--red2);font-size:28px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{background:var(--head);font-size:13px}td.c{text-align:center}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.g td{background:var(--head);font-weight:700}tr.tot td{background:var(--head);font-weight:700}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--calc)}
.chk{display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--red)}
.pill{display:inline-block;background:var(--head);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.pill.pt{background:var(--red);color:#fff;border-color:var(--red)}
.axis{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.axis.na .tasks,.axis.na .res{opacity:.35;pointer-events:none}
.axis header{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;margin-bottom:8px}
.axis h3{margin:0;font-size:15px;flex:1 1 320px}.axis h3 small{display:block;color:var(--mut);font-weight:400;font-size:12.5px}
.task{display:grid;grid-template-columns:2.2fr 1.1fr repeat(5,.65fr) auto;gap:8px;align-items:end;padding:8px;background:var(--calc);border-radius:8px;margin-bottom:8px}
.task .ev{grid-column:1/-1}
@media (max-width:720px){.task{grid-template-columns:1fr 1fr}.task>:first-child{grid-column:1/-1}}
.res{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 10px;background:var(--calc);border-radius:6px;font-size:13.5px}
button.btn{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--red);background:var(--red);color:#fff;padding:8px 14px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--red2)}button.btn.sm{padding:4px 10px;font-size:13px}
button.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;padding:2px 6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{flex:1}.hint{font-size:12.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--head);border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 10px;font-size:13px;margin:2px 4px 2px 0;max-width:100%}
.chip a{color:var(--red2);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.up{font-size:13px;color:var(--red2);cursor:pointer;font-weight:600;border:1px dashed var(--red);border-radius:999px;padding:2px 10px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:60}
.toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;justify-content:center;padding:24px 12px;overflow:auto}
.modal .box{background:var(--card);border-radius:10px;max-width:980px;width:100%;padding:18px;height:max-content;position:relative}
.modal .close{position:absolute;right:10px;top:8px}
header.top{background:linear-gradient(135deg,#8f1115,#a4161a 55%,#c0262b);padding:14px 20px}
.brand{display:flex;align-items:center;gap:16px;justify-content:flex-start!important}
.brand .lg{width:76px;height:76px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.35);flex:none}
.brand .flag{width:84px;height:56px;object-fit:cover;flex:none;margin-left:auto;border:2px solid #ffde00;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}.ttl small{font-size:11.5px;letter-spacing:.6px;color:#ffe9a8;opacity:1}
.ttl h1{font-size:28px!important;letter-spacing:2px;color:#fff;line-height:1.1}.ttl span{font-size:13px;opacity:.92}.ttl em{font-style:normal;font-size:13px;color:#ffe9a8}
@media (max-width:640px){.brand{gap:10px}.brand .lg{width:52px;height:52px}.brand .flag{width:56px;height:38px}.ttl h1{font-size:20px!important}.ttl small{font-size:9.5px}.ttl span{display:none}}
.hero{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.hero .flag{width:230px;height:auto;aspect-ratio:3/2;object-fit:cover;margin:0;border:3px solid #ffde00;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hero h1{font-size:34px;letter-spacing:3px;color:#fff;margin:2px 0 0;line-height:1.1}
.hero .sch{display:flex;align-items:center;gap:10px;justify-content:center}
.hero .lg{width:52px;height:52px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.hero small{font-size:12px;letter-spacing:.6px;color:#ffe9a8;text-align:left}
.hero span{font-size:13px;opacity:.92}.hero em{font-style:normal;font-size:13px;color:#ffe9a8}
@media (max-width:640px){.hero .flag{width:170px}.hero h1{font-size:25px;letter-spacing:2px}.hero small{font-size:10px}.hero span{font-size:12px}}
.menu{position:relative}.dd{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:300px;max-width:88vw;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px 0}
.dd[hidden]{display:none}.dd button,.dd a{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:9px 12px;cursor:pointer;text-decoration:none}.dd button:hover,.dd a:hover{background:var(--calc)}
</style></head>

 const gp=[0,0,0];let A=0;IT.forEach(i=>{if(r.a&&r.a[i[0]]){A+=i[1];gp[gOf(i[0])]+=i[1];}});
 const rt=v=>(v===''||v==null)?1:Math.min(Math.max(num(v),0),1.2);
 const ax=AX.map(m=>{const ts=(r.ax||{})[m[0]]||[];let P=0,S=0,Q=0,T=0,L=0;ts.forEach(t=>{const c=num(t.coef)||1,p=num(t.plan),d=Math.min(Math.max(num(t.done),0),p);P+=p*c;S+=d*c;Q+=d*rt(t.q)*c;T+=d*rt(t.t)*c;L+=d*rt(t.l)*c;});const A=P>0?S/P:0,B=P>0?Q/P:0,C=P>0?T/P:0,D=P>0?L/P:0;return{na:!!(r.na||{})[m[0]],has:P>0,A,B,C,D,full:A>=1-1e-9,k:Math.min((A+B+C+D)/4,1),max:m[2]};});
 const sm=ax.filter(x=>!x.na).reduce((s,x)=>s+x[ 'max'],0),f=sm>0?70/sm:0;
 ax.forEach(x=>{x.eff=x.na?0:x.max*f;x.pts=x.na?0:x.k*x.eff;});
 const B=r2(ax.reduce((s,x)=>s+x.pts,0));return{A,gp,ax,B,T:r2(A+B)};
}
